services:
  db:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_USER: orqestra_admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: orqestra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    # Pass the internal Docker DB URL to the backend
    environment:
      - DATABASE_URL=postgresql://orqestra_admin:supersecretpassword@db:5432/orqestra

  frontend:
    build:
      context: ./frontend
      dockerfile: frontend.Dockerfile
    ports:
      # Map your local 5173 port to the Nginx port 80
      - "5173:80" 
    depends_on:
      - backend

volumes:
  pgdata: